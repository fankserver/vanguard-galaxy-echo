name: Package release

# Triggers when a GitHub Release is published. Also runnable manually.
#
# The plugin references Assembly-CSharp.dll (the game's proprietary
# assembly) plus UnityEngine.UI.dll and Unity.TextMeshPro.dll (Unity
# runtime bits not covered by the UnityEngine.Modules NuGet). None can
# live on a public runner, so the repo commits PUBLICIZED stubs (method
# signatures only, no IL) at VGEcho/lib/. CI compiles against the stubs;
# the real runtime assemblies take over in-game via Mono's late binding.
#
# VGModAPI.Abstractions.dll (the autopilot arrival-snap contract) is the one
# reference that is NOT committed: it is built here from the public API repo
# at a pinned commit. It stays compile-only and is never packaged — the API
# plugin ships and loads its own copy.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout repo at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Checkout VGModAPI contract source
        uses: actions/checkout@v7
        with:
          repository: fankserver/vanguard-galaxy-api
          ref: 497c624ded3fe638833e603746b665f4ce515ea3
          path: .vgmodapi
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # 10.0.x satisfies the API checkout's global.json; 8.0.x builds VGEcho.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build VGModAPI.Abstractions (compile-only, never packaged)
        run: dotnet build .vgmodapi/VGModAPI.Abstractions/VGModAPI.Abstractions.csproj -c Release --nologo

      - name: Verify publicized references are committed
        run: |
          missing=0
          for stub in Assembly-CSharp.dll UnityEngine.UI.dll Unity.TextMeshPro.dll; do
            path="VGEcho/lib/$stub"
            if [ ! -s "$path" ]; then
              echo "::error::$path is missing or empty. Regenerate via 'assembly-publicizer --strip <game>/$stub -o $path' and commit. (--strip is required.)"
              missing=1
            else
              echo "Publicized reference present: $path ($(du -h "$path" | cut -f1))"
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Build VGEcho.dll
        run: |
          make build \
            VGAPI_DLL=.vgmodapi/VGModAPI.Abstractions/bin/Release/netstandard2.1/VGModAPI.Abstractions.dll

      - name: Stage release layout
        id: stage
        run: |
          VERSION=$(grep 'PluginVersion =' VGEcho/Plugin.cs | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_NAME="VGEcho-v${VERSION}"
          # Nested VGEcho/ is intentional: it's the folder the user drops
          # into BepInEx/plugins/.
          PKG_DIR="dist/${PKG_NAME}/VGEcho"

          rm -rf "dist/${PKG_NAME}"
          mkdir -p "$PKG_DIR"

          cp VGEcho/bin/Debug/netstandard2.1/VGEcho.dll "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          [ -f LICENSE ] && cp LICENSE "$PKG_DIR/" || true

          # Consumers must never bundle a second VGModAPI.Abstractions.dll:
          # the API plugin owns the one installed copy.
          if [ -e "$PKG_DIR/VGModAPI.Abstractions.dll" ]; then
            echo "::error::The package must not contain VGModAPI.Abstractions.dll."
            exit 1
          fi

          SIZE=$(du -sh "$PKG_DIR" | cut -f1)
          echo "Staged DLL + README — $SIZE at $PKG_DIR"

          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Zip release bundle
        run: |
          (cd "dist/${{ steps.stage.outputs.pkg_name }}" && \
             zip -qr "../${{ steps.stage.outputs.pkg_name }}.zip" VGEcho)
          ls -lh "dist/${{ steps.stage.outputs.pkg_name }}.zip"

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "dist/${{ steps.stage.outputs.pkg_name }}.zip" --clobber
          echo "Uploaded ${{ steps.stage.outputs.pkg_name }}.zip to release $TAG"
